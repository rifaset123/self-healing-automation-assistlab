        - paragraph [ref=e81]: "Fitur pada halaman ini memungkinkan mahasiswa untuk mengunggah dokumen akademik seperti KHS (Kartu Hasil Studi) atau transkrip nilai yang akan disimpan dalam database sistem. Dokumen yang diupload nantinya akan tersimpan secara aman di server, tercatat dalam basis data, dan dapat ditampilkan kembali kepada mahasiswa atau admin untuk kebutuhan validasi pendaftaran dan seleksi asisten praktikum. Berikut untuk alur yang dapat kalian lakukan:"
