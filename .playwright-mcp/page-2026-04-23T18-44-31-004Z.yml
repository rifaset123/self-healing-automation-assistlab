          - listitem [ref=e83]: Membaca informasi mengenai upload KHS/transkrip terlebih dahulu.
          - listitem [ref=e84]: Mahasiswa dapat mengupload KHS/Transkrip dengan format PDF.
          - listitem [ref=e85]: Sistem akan membaca data dari file seperti nama mahasiswa, judul file, ipk, kode matkul, nama matkul, sks, ke(berapa kali matkul diambil), dan nilai.
          - listitem [ref=e86]: Data-data pada file tersebut masuk ke dalam database sistem dan profil(ipk).
          - listitem [ref=e87]: Hasil akan menampilkan file yang sudah kalian upload.
          - listitem [ref=e88]: Dapat melihat riwayat upload file yang telah berhasil.
          - listitem [ref=e89]: Upload file baru tidak akan merubah semua database, tetapi mengisi matkul yang nilainya berubah atau baru terdeteksi saja.
